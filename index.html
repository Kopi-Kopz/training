<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Training</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training" id="appTitle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#0b0d10; --bg2:#12151a; --card:#171b21; --card2:#1e232b; --line:#262c35;
  --tx:#f2f4f7; --tx2:#a3acb9; --tx3:#6b7482;
  --acc:#c8f542; --acc-ink:#121a00; --acc-rgb:200,245,66; --acc-soft:rgba(var(--acc-rgb),.14);
  --blue:#5eb3ff; --warn:#ffb547; --bad:#ff6b6b; --good:#4ade80;
  --r:18px; --r2:12px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--tx)}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 8px) 16px calc(96px + var(--safe-b))}
.app.has-dock{padding-bottom:calc(200px + var(--safe-b))}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 14px}
.hdr h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:800}
.hdr .sub{color:var(--tx2);font-size:13px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;border-radius:99px;background:var(--card);color:var(--tx2);border:1px solid var(--line);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.pill.pending .dot{background:var(--warn)} .pill.offline .dot{background:var(--bad)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--tx2)} .dim{color:var(--tx3)} .small{font-size:13px} .tiny{font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--tx2)}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb0{margin-bottom:0}

/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(var(--acc-rgb),.22),transparent 55%),linear-gradient(160deg,#1b2128,#13171c);border:1px solid #2b333d;border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.hero h2{font-size:24px;margin:6px 0 4px;letter-spacing:-.02em;line-height:1.15}
.hero .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--tx2);font-size:13px;margin:8px 0 14px}
.tag{display:inline-block;font-size:11.5px;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.tag.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-weight:700;font-size:16px;background:var(--card2);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn.danger{color:var(--bad)}
.link{color:var(--acc);font-weight:600;font-size:14px}
a.btn{color:var(--tx);text-decoration:none}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{text-align:center;padding:8px 0 10px;border-radius:12px;background:var(--bg2);border:1px solid transparent}
.day .dn{font-size:11px;color:var(--tx3);font-weight:600}
.day .dd{font-size:15px;font-weight:700;margin:2px 0 6px}
.day .mk{width:8px;height:8px;border-radius:50%;margin:0 auto;background:var(--line)}
.day.plan .mk{background:transparent;border:2px solid var(--tx3);width:9px;height:9px}
.day.done .mk{background:var(--acc);border:0;width:9px;height:9px}
.day.today{border-color:var(--acc)}
.day.today .dn{color:var(--acc)}

/* list rows */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:18px;flex:none}
.li .t{font-weight:650}
.li .s{font-size:12.5px;color:var(--tx2)}
.chev{color:var(--tx3);margin-left:auto}

/* progress */
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}

/* workout session */
.sesh-top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);margin:0 -16px;padding:calc(var(--safe-t) + 8px) 16px 12px}
.sesh-top .row{gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.segs{display:flex;gap:3px;margin-top:10px}
.segs i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.segs i.on{background:var(--acc)} .segs i.cur{background:var(--tx)}
.clock{font-size:13px;color:var(--tx2)}
.ex-name{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.15}
.ex-meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.coach{display:flex;gap:10px;align-items:flex-start;background:var(--acc-soft);border-radius:14px;padding:12px;margin:10px 0;font-size:14px}
.coach b{color:var(--acc)}
.coach.neutral{background:var(--card2)}
.last{font-size:13px;color:var(--tx2);margin:6px 0 2px}
.sets{margin-top:6px}
.sethead,.set{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center}
.sethead{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;padding:0 2px 6px;font-weight:700}
.sethead.two,.set.two{grid-template-columns:34px 1fr 52px}
.set{padding:6px 0}
.set .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--card2);color:var(--tx2)}
.set input{width:100%;height:50px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);text-align:center;font-size:19px;font-weight:700;outline:none;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.set input:focus{border-color:var(--acc)}
.set input::placeholder{color:var(--tx3);font-weight:500;font-size:15px}
.chk{width:52px;height:50px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);display:grid;place-items:center;font-size:22px;color:var(--tx3)}
.set.done .chk{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.set.done input{background:rgba(var(--acc-rgb),.07);border-color:rgba(var(--acc-rgb),.35)}
.set.done .n{background:var(--acc);color:var(--acc-ink)}
.set.next .n{background:var(--tx);color:var(--bg)}
.set .pr{position:absolute}
.set-actions{display:flex;gap:8px;margin-top:8px}
.set-actions .btn{flex:1}
.timer-btn{height:50px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.timer-btn.run{border-color:var(--acc);color:var(--acc)}
.navrow{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:16px}
textarea.note{width:100%;min-height:44px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);padding:10px 12px;resize:vertical;outline:none;font-size:14px}

/* rest dock */
.dock{position:fixed;left:0;right:0;bottom:calc(68px + var(--safe-b));z-index:20;display:none;justify-content:center;padding:0 12px}
.dock.show{display:flex}
.dock .in{width:100%;max-width:536px;background:#1d232b;border:1px solid #333c48;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .tt{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.dock .lbl{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.dock .nx{font-size:14px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .ctl{display:flex;gap:6px;margin-left:auto}
.dock .ctl button{height:38px;min-width:44px;padding:0 10px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px}
.dock .ctl .skip{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.dock.go .in{border-color:var(--acc);background:#1f2a12}
.dock.work .in{border-color:var(--blue)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,13,16,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);font-size:11px;font-weight:600;position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--acc)}
.tab .badge{position:absolute;top:9px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--acc)}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg2);border-radius:22px 22px 0 0;border:1px solid var(--line);padding:10px 16px calc(20px + var(--safe-b));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .25s}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:var(--tx2);font-weight:600}
.field input,.field select{height:48px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);padding:0 12px;outline:none;font-size:16px;width:100%}
.field input:focus{border-color:var(--acc)}
.big-input{font-size:30px!important;font-weight:800;height:64px!important;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--tx3);font-size:10px}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .ln2{fill:none;stroke:var(--tx2);stroke-width:1.5;stroke-dasharray:3 4}
.chart .goal{stroke:var(--blue);stroke-width:1.5;stroke-dasharray:6 5}
.chart .goalt{fill:var(--blue);font-size:10px;font-weight:700}
.chart .pt{fill:var(--bg);stroke:var(--acc);stroke-width:2}
.chart .area{fill:url(#ga);opacity:.5}
.chart .br{fill:var(--acc);opacity:.85}
.chart .br.cur{opacity:1}
.chart .br.old{fill:var(--tx3);opacity:.5}

.focus{background:linear-gradient(160deg,#1b2128,#14181d);border:1px solid #2d3540;border-radius:22px;padding:14px;margin:12px 0}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px}
.fset{font-weight:800;font-size:16px}
.fprev{font-size:12.5px;color:var(--tx2)}
.frest{position:relative;display:flex;align-items:center;gap:12px;background:var(--acc-soft);border-radius:16px;padding:12px 12px 16px;margin-bottom:14px;overflow:hidden}
.frest.work{background:rgba(94,179,255,.15)}
.frest.go{background:var(--acc);color:var(--acc-ink)}
.frest .flbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.frest .ftime{font-size:42px;font-weight:800;line-height:1;letter-spacing:-.02em}
.frest .ctl{margin-left:auto;display:flex;gap:6px}
.frest .ctl button{height:42px;min-width:46px;padding:0 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--tx)}
.frest .ctl button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.frest.go .ctl button.pri{background:var(--acc-ink);color:var(--acc);border-color:var(--acc-ink)}
.fbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.06)}
.fbar i{display:block;height:100%;background:var(--acc);transition:width .25s linear}
.frest.work .fbar i{background:var(--blue)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.steppers.one{grid-template-columns:1fr}
.stepper{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:8px 6px 6px;text-align:center;min-width:0}
.stepper .sl{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.stepper .sv{display:flex;align-items:center;gap:2px;margin-top:4px}
.stepper .sv button{width:40px;height:54px;border-radius:12px;background:var(--card2);font-size:24px;font-weight:700;flex:none;color:var(--tx)}
.stepper .sv button:active{background:var(--line)}
.stepper .sv input{flex:1;min-width:0;width:100%;height:54px;background:transparent;border:0;text-align:center;font-size:28px;font-weight:800;letter-spacing:-.03em;padding:0;outline:none;font-variant-numeric:tabular-nums;color:var(--tx)}
.stepper .sv input::placeholder{color:var(--tx3);font-size:18px;font-weight:600}
.btn.huge{height:62px;font-size:18px;border-radius:16px}
.mini-h{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:20px 0 6px}
.tag-btn{flex:none;margin-top:8px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--tx2);white-space:nowrap}
.tips{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr)}
.seg3 .chip{padding:0 6px;font-size:13.5px}
.fuel .mrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px}
.fuel .macro{margin-top:12px}
.bad{color:var(--warn)}
.qa{display:flex;gap:8px;overflow-x:auto;margin:14px -16px -4px;padding:0 16px 4px;scrollbar-width:none}
.qa::-webkit-scrollbar{display:none}
.qa .chip{flex:none;height:36px;font-size:13px}
.feel{display:grid;gap:6px;margin:-4px 0 14px}
.warm{font-size:13px;color:var(--tx2);background:var(--card2);border-radius:12px;padding:9px 12px;margin-bottom:12px}
.warm b{color:var(--tx)}
.note-chip{display:inline-block;margin-top:6px;font-size:13px;background:rgba(255,181,71,.12);color:var(--tx);border-radius:10px;padding:6px 10px}
.cardio-acts{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;margin:0 -14px;padding:0 14px 2px;scrollbar-width:none}
.cardio-acts::-webkit-scrollbar{display:none}
.cardio-acts .chip{flex:none;height:36px;font-size:13px;padding:0 12px}
.col-btns{display:flex;flex-direction:column;gap:2px;flex:none}
.mini{width:30px;height:22px;border-radius:7px;background:var(--card2);font-size:10px;color:var(--tx2)}
.mini:disabled{opacity:.25}
.seg4{display:grid;grid-template-columns:repeat(4,1fr)}
.seg4 .chip{padding:0 4px;font-size:12.5px}
.mb12{margin-bottom:12px}
.review{border-color:#3a4a1c}
.weekbar{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:2px 16px;scrollbar-width:none}
.weekbar::-webkit-scrollbar{display:none}
.weekbar .chip{flex:none;height:34px;padding:0 12px;font-size:13px}
.opts{display:grid;gap:8px}
.opts .btn{justify-content:space-between;padding:0 16px}
.hero-next{margin-top:-4px;background:var(--card)}
.empty{text-align:center;color:var(--tx2);padding:24px 10px;font-size:14px}
.empty .e{font-size:30px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(30px);opacity:0;background:#242b34;border:1px solid #38424f;color:var(--tx);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;transition:transform .25s,opacity .25s;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#flash{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0}
#flash.on{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%,60%{opacity:.75}15%,45%{opacity:.1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#flash.on{animation:none}}
.app.has-dock ~ .toast{bottom:calc(168px + var(--safe-b))}
.sel{width:100%;height:44px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);padding:0 12px;font-size:15px;outline:none}
details.hist{border-top:1px solid var(--line);padding:10px 0}
details.hist:first-of-type{border-top:0}
details.hist summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
details.hist summary::-webkit-details-marker{display:none}
.hist table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.hist td{padding:4px 0;color:var(--tx2);vertical-align:top}
.hist td:last-child{text-align:right;color:var(--tx);font-variant-numeric:tabular-nums}
.prbadge{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--acc);color:var(--acc-ink);margin-left:6px;vertical-align:middle}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--tx2)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading"><div><div class="spin"></div>Loading your plan…</div></div></div>

<div class="dock" id="dock"><div class="in">
  <div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="28" fill="none" stroke="#2b333d" stroke-width="6"/><circle id="ringArc" cx="32" cy="32" r="28" fill="none" stroke="currentColor" style="color:var(--acc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="175.9" stroke-dashoffset="0"/></svg><div class="tt" id="ringTxt">0:00</div></div>
  <div style="min-width:0"><div class="lbl" id="dockLbl">Rest</div><div class="nx" id="dockNext"></div></div>
  <div class="ctl" id="dockCtl"></div>
</div></div>

<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="scrim" id="scrim" data-act="closeSheet"><div class="sheet" id="sheet"></div></div>

<script src="config.js"></script>
<script>
/* =========================================================================
   Badminton Training — front end (v21)
   Offline-first: every set is saved locally first, then synced in batches.
   ========================================================================= */

/* ---------- tiny utils ---------- */
/* ---------- per-app settings (config.js) ---------- */
const CFG_DEF = {
  ns: 'bt', name: 'Training', food: true, fitbit: true,
  schedule: { 1: 0, 2: 1, 4: 2, 5: 3, 6: 4 },            // weekday -> workout index
  sport: { type: 'badminton', label: 'Badminton', icon: '🏸', sub: 'Training, singles, doubles, club night', defMin: 90,
           kinds: [['Training', '🏸'], ['Singles', '🎯'], ['Doubles', '👥'], ['Mixed', '🤝'], ['Club night', '🌙'], ['Footwork drills', '👣']],
           match: ['Singles', 'Doubles', 'Mixed'], res: ['Games won', 'Games lost'], resWord: 'games', resFmt: 'wl' },
  checkin: ['steps', 'sleep', 'sweets'],
  weightGoal: { start: 91, goal: 85 },
  program: null,                                          // { weeks: 8 } = week-by-week program (W1 · …)
  accent: null                                            // { acc, ink, rgb }
};
const CFG = Object.assign({}, CFG_DEF, window.APP_CFG || {});
CFG.sport = Object.assign({}, CFG_DEF.sport, (window.APP_CFG || {}).sport || {});
const SPORT = CFG.sport, PROG = CFG.program;
const ACC = CFG.accent || { acc: '#c8f542', ink: '#121a00', rgb: '200,245,66' };
(function applyBrand() {
  const r = document.documentElement.style;
  r.setProperty('--acc', ACC.acc); r.setProperty('--acc-ink', ACC.ink); r.setProperty('--acc-rgb', ACC.rgb);
  document.title = CFG.name;
  const m = document.getElementById('appTitle'); if (m) m.setAttribute('content', CFG.name);
})();
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LSK = k => k.replace(/^bt\./, CFG.ns + '.');   // each app keeps its own storage
const LS = {
  get(k, d) { try { const v = localStorage.getItem(LSK(k)); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(LSK(k), JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(LSK(k)); } catch (e) {} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmtKg = n => n == null ? '–' : (Math.round(n * 10) / 10).toString();
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad(s % 60); };
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = s => { const d = parseISO(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const keyOf = s => String(s || '').toLowerCase().replace(/[—–-]/g, '-').replace(/\s+/g, ' ').trim();

/* weekday -> index into workout list (Mon heavy, Tue fast, Thu strong, Fri fit, Sat explosive) */
const SCHEDULE = CFG.schedule || {};
const ICONS = { gym: '🏋️', track: '⚡', rest: '🧘' };

/* ---------- state ---------- */
const S = {
  tab: 'today',
  plan: [], workouts: [], info: {},
  server: [], training: [], weights: [],
  session: null, outbox: [], weightBox: [], food: [], foodBox: [], health: null, planBox: null, edit: null, reviewWeek: 0, ready: null, swapAlts: [],
  sync: 'idle', loaded: false,
  progEx: null, preview: null
};

/* ---------- server bridge ---------- */
/* The app talks to your Apps Script over HTTPS. URL + key are stored only on this phone. */
const APP_VERSION = '31';
const apiCfg = () => LS.get('bt.api', null);
const hasGAS = () => { const c = apiCfg(); return !!(c && c.url && c.key); };
const ACTIONS = { getBootstrap: 'bootstrap', syncOps: 'syncOps', saveWeight: 'saveWeight', syncFood: 'syncFood', savePlan: 'savePlan', ping: 'ping' };
async function call(fn, payload, cfg) {
  const c = cfg || apiCfg();
  if (!c || !c.url || !c.key) { const e = new Error('Not connected'); e.code = 'no_config'; throw e; }
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(c.url, { method: 'POST', redirect: 'follow', signal: ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: c.key, action: ACTIONS[fn] || fn, payload: payload == null ? null : payload }) });
    let j;
    try { j = await r.json(); } catch (x) { const e = new Error('The URL did not answer like the training script. Check it ends in /exec and access is "Anyone".'); e.code = 'bad_url'; throw e; }
    if (!j.ok) { const e = new Error(j.message || j.error || 'Server error'); e.code = j.error; throw e; }
    return j;
  } catch (e) {
    if (e.name === 'AbortError') { const x = new Error('No answer from Google (timeout)'); x.code = 'timeout'; throw x; }
    if (!e.code) e.code = 'network';
    throw e;
  } finally { clearTimeout(to); }
}

/* ---------- data ---------- */
function applyData(d) {
  S.plan = S.planBox || d.plan || [];
  S.info = d.info || {};
  S.server = d.training || [];
  if (d.weights) S.weights = mergeWeights(d.weights);
  if (d.food) S.food = applyFoodOps(d.food, S.foodBox);
  if (d.health !== undefined) S.health = d.health || null;
  buildWorkouts();
  rebuildTraining();
  S.loaded = true;
}
function buildWorkouts() {
  const map = new Map();
  S.plan.forEach(p => {
    if (!map.has(p.workout)) map.set(p.workout, { name: p.workout, location: p.location, focus: p.focus, items: [] });
    map.get(p.workout).items.push(p);
  });
  S.workouts = [...map.values()];
}
function rebuildTraining() {
  const rows = new Map(S.server.map(r => [r.setId, r]));
  S.outbox.forEach(o => {
    if (o.op === 'delete') rows.delete(o.setId);
    else rows.set(o.setId, opToRow(o));
  });
  S.training = [...rows.values()].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.set - b.set));
}
function opToRow(o) {
  return { date: o.date, workout: o.workout, exercise: o.exercise, type: o.type, set: o.setNumber, target: o.target,
           kg: o.kg === '' ? '' : num(o.kg), reps: String(o.reps == null ? '' : o.reps), rest: o.rest, bw: o.bodyweight,
           notes: o.notes, sessionId: o.sessionId, setId: o.setId, feel: o.feel || '' };
}
function mergeWeights(server) {
  const m = new Map(server.map(w => [w.date, w]));
  S.weightBox.forEach(w => m.set(w.date, w));
  return [...m.values()].sort((a, b) => a.date < b.date ? -1 : 1);
}
function weightGoal() {
  const g = infoNum('Goal weight') != null ? infoNum('Goal weight') : CFG.weightGoal && CFG.weightGoal.goal;
  const st = infoNum('Start weight') != null ? infoNum('Start weight') : CFG.weightGoal && CFG.weightGoal.start;
  return g != null && st != null && st !== g ? { start: st, goal: g, gain: g > st } : null;
}
function weightChange(days) {
  const W = S.weights; if (W.length < 2) return null;
  const last = W[W.length - 1], cut = iso(new Date(parseISO(last.date).getTime() - days * 864e5));
  const prev = W.filter(w => w.date <= cut).pop() || W[0];
  return prev === last ? null : { d: last.weight - prev.weight, since: prev.date };
}
const latestWeight = () => S.weights.length ? S.weights[S.weights.length - 1].weight : null;
const infoNum = k => { const v = S.info[k]; const m = v && String(v).match(/\d+(?:[.,]\d+)?/); return m ? num(m[0]) : null; };

/* sessions derived from history */
function sessions() {
  const m = new Map();
  S.training.forEach(r => {
    const k = r.sessionId || (r.date + '|' + r.workout);
    if (!m.has(k)) m.set(k, { key: k, date: r.date, workout: r.workout, rows: [] });
    m.get(k).rows.push(r);
  });
  return [...m.values()].sort((a, b) => a.date < b.date ? 1 : -1);
}
function trainedDates() { return new Set(S.training.map(r => r.date)); }

/* last performance of an exercise (excluding a session) */
function lastPerf(name, excludeSession) {
  const k = keyOf(name);
  const rows = S.training.filter(r => keyOf(r.exercise) === k && (!excludeSession || r.sessionId !== excludeSession));
  if (!rows.length) return null;
  const lastDate = rows[rows.length - 1].date;
  const sets = rows.filter(r => r.date === lastDate).sort((a, b) => a.set - b.set);
  return { date: lastDate, sets };
}

/* stalled = same top weight for the last 3 sessions and total reps not going up */
function stallInfo(name, excludeSession) {
  const k = keyOf(name), byDate = new Map();
  S.training.forEach(r => { if (keyOf(r.exercise) === k && r.sessionId !== excludeSession) { if (!byDate.has(r.date)) byDate.set(r.date, []); byDate.get(r.date).push(r); } });
  const last3 = [...byDate.keys()].sort().slice(-3).map(d => byDate.get(d));
  if (last3.length < 3) return null;
  const top = rs => Math.max(0, ...rs.map(r => num(r.kg) || 0)), tot = rs => rs.reduce((a, r) => a + (num(r.reps) || 0), 0);
  const kg = top(last3[2]);
  if (!kg || !last3.every(rs => top(rs) === kg)) return null;
  return tot(last3[2]) <= tot(last3[0]) ? { kg } : null;
}
function lastNote(name, excludeSession) {
  const k = keyOf(name);
  for (let i = S.training.length - 1; i >= 0; i--) {
    const r = S.training[i];
    if (keyOf(r.exercise) === k && r.sessionId !== excludeSession && String(r.notes || '').trim()) return { date: r.date, note: String(r.notes).trim() };
  }
  return null;
}

/* ---------- target parsing / coaching ---------- */
function parseRange(t) {
  const m = String(t || '').match(/(\d+)\s*(?:-\s*(\d+))?/);
  if (!m || /\d\s*(s|sec|min)\b/i.test(t) || /sprint|run|rep\b/i.test(t) && !/-/.test(t)) return null;
  return { lo: +m[1], hi: +(m[2] || m[1]) };
}
function parseSeconds(t) {
  t = String(t || '');
  let m = t.match(/(\d+)\s*(?:-\s*(\d+))?\s*min/i);
  if (m) return +m[1] * 60;
  m = t.match(/(\d+)\s*(?:-\s*(\d+))?\s*s\b/i);
  if (m) return +(m[2] || m[1]);
  return 30;
}
const kgStep = kg => kg >= 40 ? 2.5 : kg >= 10 ? 2 : 1;
const round = (x, s) => Math.round(x / s) * s;
const e1rm = (kg, reps) => kg * (1 + reps / 30);

function coach(item) {
  const type = item.type;
  const last = lastPerf(item.exercise, S.session && S.session.id);
  const range = parseRange(item.target);
  const res = { kg: '', reps: [], msg: '', tone: 'neutral', last };
  const n = item.sets;
  if (type === SPORT.type) {
    res.reps = [''];
    const rb = recentBadminton();
    if (last && last.sets[0]) { const l = last.sets[0]; res.msg = `Last ${esc(cardioAct({ name: item.exercise }))}: <b>${esc(l.reps)} min${l.target ? ' · ' + esc(l.target) : ''}</b>. Log it right after you play — it keeps your weekly load honest.`; res.tone = 'acc'; }
    else res.msg = 'Pick training or match, tap Start when you walk on court, and log the ' + (SPORT.resWord === 'games' ? 'games' : 'score') + ' for matches. Intensity helps plan your next gym day.';
    if (rb && rb.min >= 60) res.msg += ` <br>${rb.when} you already played ${Math.round(rb.min)} min.`;
    return res;
  }
  if (isTimeEx(type)) {
    res.reps = [''];
    if (last && last.sets[0]) {
      const l = last.sets[0];
      res.msg = `Last ${cardioAct({ name: item.exercise })}: <b>${esc(l.reps)} min${l.kg ? ' · ' + esc(l.kg) + ' km' : ''}</b>. Go 5 min longer or a little faster.`; res.tone = 'acc';
    } else res.msg = 'Pick the activity, tap Start, and the stopwatch fills in your minutes. Distance is optional.';
    return res;
  }
  if (type === 'timed') {
    const sec = parseSeconds(item.target);
    res.reps = Array(n).fill(String(sec));
    res.msg = sec >= 120 ? 'Easy pace, get warm. Tap start and the timer runs.' : 'Tap start — the timer counts down, then your rest begins.';
    return res;
  }
  if (type === 'sprint') {
    res.reps = Array(n).fill('');
    if (last) {
      const times = last.sets.map(s => num(s.reps)).filter(x => x);
      if (times.length) { res.msg = `Best last time <b>${Math.min(...times).toFixed(2)}s</b>. Full recovery between reps — quality over quantity.`; res.tone = 'acc'; }
    }
    if (!res.msg) res.msg = 'Log your time (optional) and tap ✓. Full recovery between reps.';
    return res;
  }
  // weighted / bodyweight
  if (!last) {
    res.reps = Array(n).fill(range ? String(range.hi) : '');
    res.msg = type === 'weighted' ? 'First time — pick a weight you can do for the top of the range with 1–2 reps left.' : 'First time logging this — clean reps, stop 1–2 before failure.';
    return res;
  }
  const lastKg = Math.max(0, ...last.sets.map(s => num(s.kg) || 0));
  const reps = last.sets.map(s => num(s.reps)).filter(x => x != null);
  if (!range || !reps.length) {
    res.kg = lastKg || '';
    res.reps = Array(n).fill('').map((_, i) => last.sets[i] ? String(last.sets[i].reps) : '');
    res.msg = 'Match last time, then nudge it.';
    return res;
  }
  const allTop = reps.length >= Math.min(n, last.sets.length) && reps.every(r => r >= range.hi);
  const anyLow = reps.some(r => r < range.lo);
  const feels = last.sets.map(x => x.feel).filter(Boolean);
  const lastHard = last.sets.length && last.sets[last.sets.length - 1].feel === 'hard';
  const allEasy = feels.length && feels.length >= last.sets.length - 1 && feels.every(f => f === 'easy');
  const stall = type === 'weighted' && stallInfo(item.exercise, S.session && S.session.id);
  if (type === 'weighted' && lastKg > 0 && stall) {
    const dk = round(lastKg * 0.9, lastKg >= 20 ? 2.5 : 0.5);
    res.kg = dk; res.reps = Array(n).fill(String(range.hi));
    res.msg = `No progress for 3 sessions at ${fmtKg(lastKg)} kg. Reset to <b>${fmtKg(dk)} kg</b> for ${range.hi} clean reps and build up again, or swap the variation (ⓘ).`;
  } else if (type === 'weighted' && lastKg > 0) {
    if (allTop && lastHard) {
      res.kg = lastKg; res.reps = Array(n).fill(String(range.hi));
      res.msg = `You hit ${range.hi} everywhere, but the last set felt hard. Stay at <b>${fmtKg(lastKg)} kg</b> once more and make it feel solid.`;
    } else if (allTop) {
      const nk = round(lastKg + kgStep(lastKg) * (allEasy ? 2 : 1), 0.5);
      res.kg = nk; res.reps = Array(n).fill(String(range.lo)); res.tone = 'acc';
      res.msg = allEasy ? `${range.hi} reps everywhere and it felt easy. Jump to <b>${fmtKg(nk)} kg</b> and build back from ${range.lo}.`
                        : `You hit ${range.hi} on every set. Go up to <b>${fmtKg(nk)} kg</b> and build back from ${range.lo}.`;
    } else if (anyLow) {
      res.kg = lastKg; res.reps = Array(n).fill(String(range.lo));
      res.msg = `Stay at <b>${fmtKg(lastKg)} kg</b> and get every set to at least ${range.lo}.`;
    } else {
      res.kg = lastKg; res.tone = 'acc';
      const add = allEasy ? 2 : 1;
      res.reps = Array(n).fill('').map((_, i) => String(Math.min(range.hi, (num(last.sets[i] && last.sets[i].reps) || range.lo) + add)));
      res.msg = allEasy ? `Same <b>${fmtKg(lastKg)} kg</b>. It felt easy last time, so aim for 2 more reps per set.` : `Same <b>${fmtKg(lastKg)} kg</b> — beat last time by one rep per set.`;
    }
  } else {
    if (allTop) { res.msg = `Top of range everywhere — add a slow eccentric or a few kg.`; res.tone = 'acc'; }
    else res.msg = 'Beat last time by one rep on at least one set.';
    res.kg = lastKg || '';
    res.reps = Array(n).fill('').map((_, i) => String(Math.min(range.hi, (num(last.sets[i] && last.sets[i].reps) || range.lo) + (allTop ? 0 : 1))));
  }
  return res;
}
function lastText(last, type) {
  if (!last) return '';
  if (isTimeEx(type)) { const l = last.sets[0]; const ago = daysBetween(last.date, today()); return `Last (${ago === 0 ? 'today' : ago === 1 ? 'yesterday' : ago + ' days ago'}): ${l.reps} min${l.kg ? ' · ' + l.kg + ' km' : ''}${type === SPORT.type && l.target ? ' · ' + l.target : ''}${l.feel === 'hard' ? ' · hard' : l.feel === 'easy' ? ' · easy' : ''}`; }
  const ago = daysBetween(last.date, today());
  const when = ago === 0 ? 'today' : ago === 1 ? 'yesterday' : ago + ' days ago';
  const parts = last.sets.map(s => (type === 'weighted' && s.kg !== '' && s.kg != null ? `${fmtKg(num(s.kg))}×${s.reps}` : type === 'sprint' ? (s.reps ? s.reps + 's' : '✓') : (s.reps || '✓')) + (s.feel === 'hard' ? ' 🥵' : s.feel === 'easy' ? ' 😌' : ''));
  return `Last (${when}): ${parts.join(' · ')}`;
}

/* ---------- outbox / sync ---------- */
let flushing = false, flushTimer = null, retryMs = 4000;
function enqueue(op) {
  S.outbox = S.outbox.filter(o => o.setId !== op.setId);
  S.outbox.push(op);
  LS.set('bt.outbox', S.outbox);
  rebuildTraining();
  scheduleFlush(600);
  renderSync();
}
function scheduleFlush(ms) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
async function flush() {
  if (flushing || !hasGAS()) { renderSync(); return; }
  if (!S.outbox.length && !S.weightBox.length && !S.foodBox.length && !S.planBox) { S.sync = 'idle'; renderSync(); return; }
  flushing = true; S.sync = 'syncing'; renderSync();
  try {
    if (S.outbox.length) {
      const batch = S.outbox.slice();
      const r = await call('syncOps', batch);
      const done = new Set(r.applied || []);
      batch.forEach(o => {
        if (!done.has(o.setId)) return;
        S.server = S.server.filter(x => x.setId !== o.setId);
        if (o.op !== 'delete') S.server.push(opToRow(o));
      });
      S.outbox = S.outbox.filter(o => !(done.has(o.setId) && batch.includes(o)));
      LS.set('bt.outbox', S.outbox);
      cacheData();
    }
    if (S.foodBox.length) {
      const batch = S.foodBox.slice();
      const r = await call('syncFood', batch);
      const done = new Set(r.applied || []);
      S.foodBox = S.foodBox.filter(o => !(done.has(o.id) && batch.includes(o)));
      LS.set('bt.foodBox', S.foodBox);
    }
    if (S.planBox) {
      const sent = S.planBox;
      const r = await call('savePlan', sent);
      if (S.planBox === sent) { S.planBox = null; LS.del('bt.planBox'); if (r && r.plan && r.plan.length) { S.plan = r.plan; buildWorkouts(); } }
    }
    while (S.weightBox.length) {
      const w = S.weightBox[0];
      const r = await call('saveWeight', w);
      S.weightBox.shift(); LS.set('bt.weightBox', S.weightBox);
      if (r && r.weights) S.weights = mergeWeights(r.weights);
    }
    cacheData();
    S.sync = 'idle'; retryMs = 4000;
  } catch (e) {
    if (e.code === 'bad_key' || e.code === 'bad_url') { S.sync = 'badkey'; }
    else { S.sync = 'offline'; retryMs = Math.min(retryMs * 2, 60000); scheduleFlush(retryMs); }
  }
  flushing = false;
  rebuildTraining();
  renderSync();
  if ((S.outbox.length || S.foodBox.length) && S.sync === 'idle') scheduleFlush(300);
}
function cacheData() { LS.set('bt.cache', { plan: S.plan, info: S.info, training: S.server, weights: S.weights, food: S.food, health: S.health }); }
window.addEventListener('online', () => scheduleFlush(200));
let hiddenAt = 0, refreshing = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  scheduleFlush(200); tick();
  if (hiddenAt && Date.now() - hiddenAt > 5 * 60e3) refreshData();
  hiddenAt = 0;
});
/* Reload everything from the sheet after the app was in the background for a while */
async function refreshData() {
  if (refreshing || !hasGAS()) return;
  refreshing = true;
  try {
    const d = await call('getBootstrap');
    applyData(d); cacheData();
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ($('#scrim').classList.contains('show') || typing) S.pendingRender = true; else render();
    scheduleFlush(100);
  } catch (e) {}
  refreshing = false;
}

/* ---------- audio / haptics / wake lock ---------- */
let actx = null, wake = null;
function unlockAudio() {
  setAudioSession();
  try {
    const fresh = !actx;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    // iPhone puts the sound engine in 'interrupted' when other audio (e.g. YouTube Music) starts
    if (actx.state !== 'running') actx.resume();
    if (fresh) { const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0); }
  } catch (e) {}
}
function beep(freq = 880, dur = 0.15, times = 1) {
  if (!actx) return;
  try { if (actx.state !== 'running') actx.resume(); } catch (e) {}
  for (let i = 0; i < times; i++) {
    const t = actx.currentTime + i * (dur + 0.08);
    const o = actx.createOscillator(), g = actx.createGain();

    s.ex.forEach(ex => ex.sets.forEach(st => { if (st.done) enqueue({ op: 'delete', setId: st.id }); }));
  }
  S.session = null; stopAlarm(); saveSession(); keepAwake(false); closeSheet();
  S.tab = save ? 'today' : 'train';
  render();
  if (save) { toast('Workout saved 💪'); scheduleFlush(100); }

function summary() {
  const s = S.session; let sets = 0, vol = 0; const prs = [];
  s.ex.forEach(ex => {
    const done = ex.sets.filter(x => x.done); sets += done.length;
    if (ex.type === 'weighted') {
      let best = 0, bestTxt = '';
      done.forEach(x => { const kg = num(x.kg) || 0, r = num(x.reps) || 0; vol += kg * r; const e = e1rm(kg, r); if (e > best) { best = e; bestTxt = `${fmtKg(kg)} kg × ${r}`; } });
      const prior = S.training.filter(r => keyOf(r.exercise) === keyOf(ex.name) && r.sessionId !== s.id).reduce((m, r) => Math.max(m, e1rm(num(r.kg) || 0, num(r.reps) || 0)), 0);
      if (best > 0 && prior > 0 && best > prior + 0.01) prs.push({ name: ex.name, txt: bestTxt });
    }
    if (ex.type === 'sprint') {
      const t = done.map(x => num(x.reps)).filter(x => x); if (!t.length) return;
      const prior = S.training.filter(r => keyOf(r.exercise) === keyOf(ex.name) && r.sessionId !== s.id).map(r => num(r.reps)).filter(x => x);
      if (prior.length && Math.min(...t) < Math.min(...prior)) prs.push({ name: ex.name, txt: Math.min(...t).toFixed(2) + ' s' });
    }
  });
  const cx = s.ex.filter(e => isTimeEx(e.type)), cs = cx.flatMap(e => e.sets.filter(x => x.done));

const wkOf = n => { const m = String(n).match(/^W(\d+)\s*·/); return m ? +m[1] : null; };
const progLabel = n => String(n).replace(/^W\d+\s*·\s*/, '');

const optLabel = n => String(n).includes(':') ? String(n).split(':').slice(1).join(':').trim() : progLabel(n);

/* Monday of program week 1: set in the app > Info sheet "Program start" > the week the app was first opened */
function progStart() {

/* PROGRESS */
function renderProgress() {
  const ss = sessions();
  // weekly volume, last 8 weeks
  const ws0 = weekStart(new Date());
  const weeks = Array.from({ length: 8 }, (_, i) => { const d = new Date(ws0); d.setDate(d.getDate() - (7 - i) * 7); return iso(d); });
  const vol = new Map(weeks.map(w => [w, 0])), cnt = new Map(weeks.map(w => [w, 0]));
  S.training.forEach(r => { const k = iso(weekStart(parseISO(r.date))); if (vol.has(k) && r.type === 'weighted') vol.set(k, vol.get(k) + (num(r.kg) || 0) * (num(r.reps) || 0)); });
  ss.forEach(s => { const k = iso(weekStart(parseISO(s.date))); if (cnt.has(k)) cnt.set(k, cnt.get(k) + 1); });

  const exNames = [...new Set(S.training.filter(r => ['weighted', 'sprint', 'bodyweight', 'cardio', SPORT.type].includes(r.type)).map(r => r.exercise))];
  if (!S.progEx || !exNames.includes(S.progEx)) S.progEx = exNames.find(n => /squat/i.test(n)) || exNames[0] || null;
  let exChart = '<div class="empty"><div class="e">📈</div>Log a few sessions and your lifts will chart here.</div>', exStats = '';
  if (S.progEx) {
    const rows = S.training.filter(r => r.exercise === S.progEx);
    const type = rows[0] && rows[0].type;
    const byDate = new Map();
    rows.forEach(r => {
      let v;
      if (type === 'sprint') v = num(r.reps); else if (type === 'weighted') v = num(r.kg); else v = num(r.reps);
      if (!v) return;
      const cur = byDate.get(r.date);
      byDate.set(r.date, cur == null ? v : isTimeEx(type) ? cur + v : type === 'sprint' ? Math.min(cur, v) : Math.max(cur, v));
    });
    const pts = [...byDate.entries()].sort().map(([d, v]) => [parseISO(d).getTime(), Math.round(v * 10) / 10]);
    const unit = isTimeEx(type) ? 'minutes' : type === 'sprint' ? 's (best)' : type === 'weighted' ? 'kg (top set)' : 'reps (best set)';
    if (pts.length >= 2) exChart = lineChart([{ pts, cls: 'ln', dots: true, area: true }], { unit });
    else if (pts.length === 1) exChart = `<div class="empty">One session so far: <b>${pts[0][1]} ${unit}</b>. One more and you'll see a trend.</div>`;
    if (pts.length) {
      const best = type === 'sprint' ? Math.min(...pts.map(p => p[1])) : Math.max(...pts.map(p => p[1]));
      const first = pts[0][1], lastv = pts[pts.length - 1][1];
      const ch = type === 'sprint' ? first - lastv : lastv - first;
      exStats = `<div class="grid3 mt"><div class="stat"><div class="v num" style="font-size:19px">${best}</div><div class="l">best</div></div>
        <div class="stat"><div class="v num" style="font-size:19px;color:${ch >= 0 ? 'var(--good)' : 'var(--bad)'}">${ch >= 0 ? '+' : ''}${Math.round(ch * 10) / 10}</div><div class="l">since first</div></div>
        <div class="stat"><div class="v num" style="font-size:19px">${pts.length}</div><div class="l">sessions</div></div></div><div class="tiny dim mt">${unit}</div>`;
    }
  }

  const hist = ss.slice(0, 15).map(s => {
    const byEx = new Map();
    s.rows.forEach(r => { if (!byEx.has(r.exercise)) byEx.set(r.exercise, []); byEx.get(r.exercise).push(r); });
    const v = s.rows.reduce((m, r) => m + (r.type === 'weighted' ? (num(r.kg) || 0) * (num(r.reps) || 0) : 0), 0);
    return `<details class="hist"><summary><div class="ic" style="width:36px;height:36px;border-radius:10px;background:var(--card2);display:grid;place-items:center">${s.workout === 'Cardio' ? '🫀' : s.workout === SPORT.label ? SPORT.icon : /gym/i.test(s.workout) ? ICONS.gym : ICONS.track}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:650;font-size:14px">${esc(s.workout)}</div><div class="tiny muted">${fmtDate(s.date)} · ${s.rows.length} sets${v ? ' · ' + Math.round(v) + ' kg' : ''}</div></div><span class="chev">›</span></summary>
      <table>${[...byEx.entries()].map(([n, rs]) => `<tr><td>${esc(n)}</td><td>${rs.sort((a, b) => a.set - b.set).map(r => isTimeEx(r.type) ? `${esc(r.reps)} min${r.kg !== '' && r.kg != null ? ' · ' + esc(r.kg) + ' km' : ''}` : r.type === 'weighted' && r.kg !== '' ? `${fmtKg(num(r.kg))}×${esc(r.reps)}` : r.type === 'sprint' ? (r.reps ? esc(r.reps) + 's' : '✓') : esc(r.reps || '✓')).join(', ')}</td></tr>`).join('')}</table></details>`;
  }).join('');

  $('#app').innerHTML = header('Progress', `${ss.length} sessions logged`) + `<button class="btn mb12" data-act="review" data-v="0">📊 Weekly review</button>
    <div class="card"><h3>Sessions per week</h3>${barChart(weeks.map(w => cnt.get(w)), weeks.map(w => { const d = parseISO(w); return d.getDate() + '.' + (d.getMonth() + 1); }), { goal: 5 })}</div>
    <div class="card"><h3>Lift tracker</h3>
      ${exNames.length ? `<select class="sel" data-f="progEx">${exNames.map(n => `<option ${n === S.progEx ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : ''}
      <div class="mt">${exChart}</div>${exStats}</div>
    <div class="card"><h3>Weekly volume (kg)</h3>${barChart(weeks.map(w => Math.round(vol.get(w))), weeks.map(w => { const d = parseISO(w); return d.getDate() + '.' + (d.getMonth() + 1); }), {})}</div>
    <div class="card"><h3>History</h3>${hist || '<div class="empty"><div class="e">🗓️</div>No sessions yet.</div>'}</div>`;
}

/* BODY */
function renderBody() {
  const W = S.weights, lw = latestWeight(), wg = weightGoal();
  const start = wg && wg.start, goal = wg ? wg.goal : null;
  let chart = '<div class="empty"><div class="e">⚖️</div>Log your weight a few mornings and the trend shows up here.</div>', rateTxt = '';
  const recent = W.slice(-60);
  if (recent.length >= 2) {
    const pts = recent.map(w => [parseISO(w.date).getTime(), w.weight]);
    const avg = recent.map((w, i) => { const from = parseISO(w.date).getTime() - 6 * 864e5; const win = recent.slice(0, i + 1).filter(x => parseISO(x.date).getTime() >= from); return [parseISO(w.date).getTime(), win.reduce((m, x) => m + x.weight, 0) / win.length]; });
    chart = lineChart([{ pts: avg, cls: 'ln', area: true }, { pts, cls: 'ln2', dots: true, dotsOnly: true }], { goal, unit: 'kg' });
    const last28 = W.filter(w => daysBetween(w.date, today()) <= 28);
    if (last28.length >= 3) {
      const xs = last28.map(w => parseISO(w.date).getTime() / 864e5), ys = last28.map(w => w.weight);
      const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
      const slope = xs.reduce((m, x, i) => m + (x - mx) * (ys[i] - my), 0) / xs.reduce((m, x) => m + (x - mx) ** 2, 0);
      const perWeek = slope * 7;
      const cur = avg[avg.length - 1][1];
      let eta = '';
      if (wg && wg.gain && perWeek > 0.05 && cur < goal) { const wk = (goal - cur) / perWeek; const d = new Date(); d.setDate(d.getDate() + wk * 7); eta = ` · goal around <b>${d.getDate()} ${MONTHS[d.getMonth()]}</b>`; }
      if (wg && !wg.gain && perWeek < -0.05 && cur > goal) { const wk = (cur - goal) / -perWeek; const d = new Date(); d.setDate(d.getDate() + wk * 7); eta = ` · goal around <b>${d.getDate()} ${MONTHS[d.getMonth()]}</b>`; }
      const onTrack = wg && (wg.gain ? perWeek > 0.1 && perWeek <= 0.5 : perWeek < -0.25 && perWeek >= -1);
      const tone = !wg ? (Math.abs(perWeek) < 0.15 ? 'Stable.' : perWeek > 0 ? 'Trending up.' : 'Trending down.')
        : wg.gain ? (perWeek > 0.5 ? 'Fast — slower gains stay lean.' : perWeek > 0.1 ? 'Right on track.' : perWeek >= -0.1 ? 'Flat — add a snack on training days.' : 'Trending down — eat a bit more.')
        : perWeek < -1 ? 'Fast — make sure training quality holds.' : perWeek < -0.25 ? 'Right on track.' : perWeek <= 0.1 ? 'Flat — tighten sweets & steps a bit.' : 'Trending up.';
      rateTxt = `<div class="coach ${onTrack ? '' : 'neutral'}"><span>${perWeek > 0.05 ? '📈' : perWeek < -0.05 ? '📉' : '➖'}</span><div><b class="num">${perWeek > 0 ? '+' : ''}${perWeek.toFixed(2)} kg/week</b> over 4 weeks${eta}. ${tone}</div></div>`;
    }
  }
  const pct = lw != null && wg ? Math.max(0, Math.min(100, (start - lw) / (start - goal) * 100)) : 0;
  const ch28 = weightChange(28);
  const wk = W.filter(w => daysBetween(w.date, today()) < 7);
  const avgOf = k => { const v = wk.map(w => num(w[k])).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b) / v.length : null; };
  const sweetsDays = wk.filter(w => /^(y|yes|ja|1|true)/i.test(w.sweets)).length;
  const hw = hDays().filter(x => daysBetween(x.date, today()) < 7 && daysBetween(x.date, today()) >= 0);
  const hAvg = k => { const v = hw.filter(x => x[k] != null && (k !== 'steps' || x.date !== today())).map(x => x[k]); return v.length ? v.reduce((a, b) => a + b) / v.length : null; };
  const st = hAvg('steps') != null ? hAvg('steps') : avgOf('steps'), sl = hAvg('sleep') != null ? hAvg('sleep') : avgOf('sleep');
  const fDays = [...new Set(S.food.filter(f => daysBetween(f.date, today()) < 7 && daysBetween(f.date, today()) >= 0).map(f => f.date))];
  const fAvg = fDays.length ? { days: fDays.length, kcal: fDays.reduce((a, d) => a + foodTotals(d).kcal, 0) / fDays.length, protein: fDays.reduce((a, d) => a + foodTotals(d).protein, 0) / fDays.length } : null;

  $('#app').innerHTML = header('Body', wg ? `Goal ${fmtKg(goal)} kg` : 'Weight') + (wg ? `
    <div class="card"><div class="row between"><div class="stat"><div class="l">Current</div><div class="v num" style="font-size:34px">${lw != null ? fmtKg(lw) : '–'}<span class="small muted"> kg</span></div></div>
      <div class="stat" style="text-align:right"><div class="l">${wg.gain ? 'Gained so far' : 'Lost so far'}</div><div class="v num" style="color:var(--acc)">${lw != null ? fmtKg(Math.max(0, wg.gain ? lw - start : start - lw)) : '–'}<span class="small muted"> kg</span></div></div></div>
      <div class="bar mt"><i style="width:${pct}%"></i></div><div class="row between tiny dim mt"><span>${fmtKg(start)} kg start</span><span>${Math.round(pct)}%</span><span>${fmtKg(goal)} kg goal</span></div></div>` : `
    <div class="card"><div class="row between"><div class="stat"><div class="l">Current</div><div class="v num" style="font-size:34px">${lw != null ? fmtKg(lw) : '–'}<span class="small muted"> kg</span></div></div>
      <div class="stat" style="text-align:right"><div class="l">4 weeks</div><div class="v num">${ch28 ? (ch28.d > 0 ? '+' : '') + ch28.d.toFixed(1) : '–'}<span class="small muted"> kg</span></div></div></div>
      <div class="tiny dim mt">Optional: add a "Goal weight" row in the Info sheet to see progress towards a goal.</div></div>`) + `
    <button class="btn pri" data-act="weighIn">＋ ${CFG.checkin.length ? 'Daily check-in' : 'Log weight'}</button>
    <div class="card mt"><h3>Trend · 7-day average</h3>${chart}${rateTxt}</div>
    ${CFG.food || CFG.fitbit ? `<div class="card"><h3>Last 7 days</h3><div class="grid3">
      <div class="stat"><div class="v num" style="font-size:19px">${st != null ? Math.round(st).toLocaleString('de-CH') : '–'}</div><div class="l">avg steps</div></div>
      <div class="stat"><div class="v num" style="font-size:19px">${sl != null ? sl.toFixed(1) : '–'}</div><div class="l">avg sleep h</div></div>
      <div class="stat"><div class="v num" style="font-size:19px">${wk.length ? sweetsDays + '/' + wk.length : '–'}</div><div class="l">sweets days</div></div>
      <div class="stat"><div class="v num" style="font-size:19px">${fAvg ? Math.round(fAvg.kcal).toLocaleString('de-CH') : '–'}</div><div class="l">avg kcal</div></div>
      <div class="stat"><div class="v num" style="font-size:19px">${fAvg ? Math.round(fAvg.protein) + ' g' : '–'}</div><div class="l">avg protein</div></div>
      <div class="stat"><div class="v num" style="font-size:19px">${fAvg ? fAvg.days + '/7' : '–'}</div><div class="l">days food logged</div></div></div>
      ${fAvg ? '' : '<div class="tiny dim mt">Food averages show once you log meals on the Today screen.</div>'}</div>
    <div class="card"><h3>Nutrition targets</h3>

/* ---------- weekly review ---------- */
function weekReview(off) {
  const ws = weekStart(new Date()); ws.setDate(ws.getDate() - 7 * off);
  const we = new Date(ws); we.setDate(we.getDate() + 7);
  const a = iso(ws), b = iso(we), pa = iso(new Date(ws.getTime() - 7 * 864e5));
  const inW = d => d >= a && d < b, inP = d => d >= pa && d < a;
  const ss = sessions().filter(x => inW(x.date));
  let planned = ss.filter(x => S.workouts.some(w => w.name === x.workout)).length, req = Object.keys(SCHEDULE).length || 5;
  if (PROG) { const n = Math.max(1, Math.min(PROG.weeks, progWeekOf(a))), gs = weekGroups(n); req = gs.length; planned = gs.filter(g => ss.some(x => g.options.some(o => o.name === x.workout))).length; }
  const mins = t => S.training.filter(r => inW(r.date) && r.type === t).reduce((m, r) => m + (num(r.reps) || 0), 0);
  // records this week vs everything before it
  const prs = [];
  [...new Set(S.training.filter(r => inW(r.date) && (r.type === 'weighted' || r.type === 'sprint')).map(r => r.exercise))].forEach(n => {
    const rows = S.training.filter(r => r.exercise === n), wk = rows.filter(r => inW(r.date)), before = rows.filter(r => r.date < a);
    if (!before.length) return;
    if (wk[0].type === 'sprint') {
      const t = Math.min(...wk.map(r => num(r.reps)).filter(Boolean)), pt = Math.min(...before.map(r => num(r.reps)).filter(Boolean));
      if (isFinite(t) && isFinite(pt) && t < pt) prs.push(`${n} ${t.toFixed(2)} s`);
    } else {
      const best = rs => rs.reduce((m, r) => { const e = e1rm(num(r.kg) || 0, num(r.reps) || 0); return e > m.e ? { e, r } : m; }, { e: 0, r: null });
      const w = best(wk), p = best(before);
      if (w.r && w.e > p.e + 0.01) prs.push(`${n} ${fmtKg(num(w.r.kg))}×${w.r.reps}`);
    }
  });
  const avg = v => v.length ? v.reduce((x, y) => x + y, 0) / v.length : null;
  const wNow = avg(S.weights.filter(w => inW(w.date)).map(w => w.weight)), wPrev = avg(S.weights.filter(w => inP(w.date)).map(w => w.weight));
  const hw = hDays().filter(x => inW(x.date));
  const steps = avg(hw.filter(x => x.steps != null && x.date !== today()).map(x => x.steps));
  const sleep = avg(hw.filter(x => x.sleep != null).map(x => x.sleep));
  const fdays = [...new Set(S.food.filter(f => inW(f.date)).map(f => f.date))];
  const prot = avg(fdays.map(d => foodTotals(d).protein)), kcal = avg(fdays.map(d => foodTotals(d).kcal));
  const t = foodTargets(), protHit = fdays.filter(d => foodTotals(d).protein >= t.lo).length;
  const dW = wNow != null && wPrev != null ? wNow - wPrev : null;
  let tip;
  const few = planned < Math.min(3, req);
  if (off === 0 && new Date().getDay() !== 0 && new Date().getDay() !== 1 && few) tip = `Week still running: ${planned} of ${req} ${PROG ? 'program workouts' : 'sessions'} so far.`;
  else if (few) tip = PROG ? `Only ${planned} of ${req} program workouts. Book them in your calendar around ${SPORT.label.toLowerCase()} like appointments.` : `Only ${planned} of ${req} planned sessions. Put Monday, Thursday and Saturday in your calendar like appointments.`;
  else if (PROG && planned >= req) tip = prs.length ? `Full week done and ${prs.length} new record${prs.length > 1 ? 's' : ''}. Great consistency.` : 'Full program week done. Great consistency.';
  else if (!CFG.food || !CFG.weightGoal) tip = prs.length ? `${prs.length} new record${prs.length > 1 ? 's' : ''}. Keep going.` : `${planned} of ${req} done. Aim for all ${req} next week.`;
  else if (fdays.length >= 3 && prot != null && prot < t.lo - 15) tip = `Protein averaged ${Math.round(prot)} g. One extra shake or Skyr a day gets you to ${t.lo} g.`;
  else if (sleep != null && sleep < 7) tip = `Sleep averaged ${sleep.toFixed(1)} h. Aim for lights out 30 minutes earlier, at least before gym days.`;
  else if (dW != null && dW > 0.3) tip = `Weight is up ${dW.toFixed(1)} kg. Check sweets and snack portions this week.`;
  else if (dW != null && dW < -1) tip = `Down ${(-dW).toFixed(1)} kg in a week — fast. Eat a little more on training days to keep your strength.`;
  else if (dW != null && dW > -0.15) tip = `Weight is flat. Take 150–200 kcal a day off, or add about 2'000 steps.`;
  else if (prs.length) tip = `${prs.length} new record${prs.length > 1 ? 's' : ''}. Same plan next week — it's working.`;
  else tip = 'Solid week. Same again next week.';
  return { a, b, planned, req, sessions: ss.length, bad: mins(SPORT.type), cardio: mins('cardio'), prs, wNow, dW, steps, sleep, fdays: fdays.length, prot, kcal, protHit, tip };
}

function activityBonus(d) {

function addCustomFood() {
  const name = $('#fName').value.trim(), kcal = num($('#fKcal').value), protein = num($('#fProt').value);
  if (!name) { $('#fName').focus(); toast('Enter what you ate'); return; }
  if (kcal == null && protein == null) { $('#fKcal').focus(); toast('Enter kcal or protein'); return; }
  const e = { name, kcal: kcal || 0, protein: protein || 0 };
  addFood(e);
  if ($('#fSaveQa').classList.contains('on')) { const ps = presets(); ps.push({ name, kcal: Math.round(e.kcal), protein: Math.round(e.protein) }); LS.set('bt.presets', ps.slice(-20)); }
  toast(`+ ${name}`); render(); refreshFoodSheet();
}

/* ---------- charts (inline SVG) ---------- */
function lineChart(series, o) {
  const W = 340, H = 180, P = { l: 34, r: 12, t: 12, b: 22 };
  const all = series.flatMap(s => s.pts);
  let xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  if (o.goal != null) ys = ys.concat(o.goal);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (x1 === x0) x1 = x0 + 1;
  const pad = (y1 - y0) * 0.12 || 1; y0 -= pad; y1 += pad;
  const sx = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), sy = y => P.t + (1 - (y - y0) / (y1 - y0)) * (H - P.t - P.b);
  let g = `<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ACC.acc}" stop-opacity=".45"/><stop offset="1" stop-color="${ACC.acc}" stop-opacity="0"/></linearGradient></defs>`;
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, y = sy(v); g += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text class="axis" x="${P.l - 6}" y="${y + 3}" text-anchor="end">${Math.round(v * 10) / 10}</text>`; }
  const dl = t => { const d = new Date(t); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
  g += `<text class="axis" x="${P.l}" y="${H - 5}">${dl(x0)}</text><text class="axis" x="${W - P.r}" y="${H - 5}" text-anchor="end">${dl(x1)}</text>`;
  if (o.goal != null) g += `<line class="goal" x1="${P.l}" x2="${W - P.r}" y1="${sy(o.goal)}" y2="${sy(o.goal)}"/><text class="goalt" x="${W - P.r - 2}" y="${sy(o.goal) - 5}" text-anchor="end">Goal ${o.goal}</text>`;
  series.forEach(s => {
    const d = s.pts.map((p, i) => (i ? 'L' : 'M') + sx(p[0]).toFixed(1) + ' ' + sy(p[1]).toFixed(1)).join(' ');
    if (s.area && s.pts.length > 1) g += `<path class="area" d="${d} L${sx(s.pts[s.pts.length - 1][0]).toFixed(1)} ${H - P.b} L${sx(s.pts[0][0]).toFixed(1)} ${H - P.b} Z"/>`;
    if (!s.dotsOnly) g += `<path class="${s.cls}" d="${d}"/>`;
    if (s.dots) g += s.pts.map(p => `<circle class="${s.dotsOnly ? '' : 'pt'}" ${s.dotsOnly ? 'fill="#a3acb9" opacity=".7"' : ''} cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="${s.dotsOnly ? 2.4 : 3.5}"/>`).join('');
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function barChart(vals, labels, o) {
  const W = 340, H = 150, P = { l: 8, r: 8, t: 16, b: 20 };
  const max = Math.max(1, ...vals, o.goal || 0);
  const bw = (W - P.l - P.r) / vals.length;
  let g = '';
  if (o.goal) { const y = P.t + (1 - o.goal / max) * (H - P.t - P.b); g += `<line class="goal" x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/>`; }
  vals.forEach((v, i) => {
    const h = v / max * (H - P.t - P.b), x = P.l + i * bw + bw * 0.18, y = H - P.b - h;
    const cls = i === vals.length - 1 ? 'br cur' : 'br' + (v === 0 ? ' old' : '');
    g += `<rect class="${cls}" x="${x.toFixed(1)}" y="${(v ? y : H - P.b - 2).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${(v ? h : 2).toFixed(1)}" rx="4"/>`;
    if (v) g += `<text class="axis" x="${(x + bw * 0.32).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" style="fill:var(--tx2)">${v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v}</text>`;
    g += `<text class="axis" x="${(x + bw * 0.32).toFixed(1)}" y="${H - 5}" text-anchor="middle">${labels[i]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ---------- sheet ---------- */
function showSheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#scrim').classList.add('show'); }
function closeSheet() { $('#scrim').classList.remove('show'); S.edit = null; if (S.pendingRender) { S.pendingRender = false; setTimeout(render, 0); } }

/* ---------- events ---------- */
const ACT = {
  tab: el => { S.tab = el.dataset.v; closeSheet(); render(); window.scrollTo(0, 0); },
  start: el => openReadiness(el.dataset.v),
  ready: el => { S.ready[el.dataset.k] = +el.dataset.v; renderReadiness(); },
  readyGo: () => { const r = S.ready; closeSheet(); startWorkout(r.name, readyMode(r)); },
  step: el => stepValue(+el.dataset.si, el.dataset.f, +el.dataset.d),
  review: el => openReview(+el.dataset.v),
  pickWeek: el => { S.pickWeek = +el.dataset.v; S.preview = null; renderPicker(); },
  setWeek: el => { const cur = progWeekOf(today()), want = Math.max(1, cur + (+el.dataset.v)); const st = weekStart(new Date()); st.setDate(st.getDate() - (want - 1) * 7); LS.set('bt.progStart', iso(st)); S.pickWeek = null; openSettings(); render(); },
  planEdit: el => openPlanEditor(el.dataset.v),
  pMove: el => { const e = S.edit, i = +el.dataset.i, j = i + (+el.dataset.d); if (j < 0 || j >= e.items.length) return; [e.items[i], e.items[j]] = [e.items[j], e.items[i]]; renderPlanEditor(); },
  pDel: el => { const e = S.edit, i = +el.dataset.i; if (el.dataset.armed) { e.items.splice(i, 1); renderPlanEditor(); return; } el.dataset.armed = '1'; el.textContent = '✓?'; el.setAttribute('aria-label', 'Tap again to remove'); setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = '✕'; } }, 3000); },
  pItem: el => { S.edit.cur = +el.dataset.i; renderPlanEditor(); },
  peType: el => { $('#peTypeV').value = el.dataset.v; el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); },
  peSets: el => { const i = $('#peSets'); i.value = Math.max(1, Math.min(10, (parseInt(i.value, 10) || 1) + (+el.dataset.d))); },
  peBack: () => { S.edit.cur = null; renderPlanEditor(); },
  peDone: () => { const it = itemFromForm(); if (!it) return; const e = S.edit; if (e.cur >= 0) e.items[e.cur] = Object.assign({}, e.items[e.cur], it); else e.items.push(it); e.cur = null; renderPlanEditor(); },
  pSave: () => savePlanEdit(),
  keepSwap: () => keepSwap(),
  cardioStart: () => startCardioSession('cardio'),
  badmStart: () => startCardioSession(SPORT.type),
  addCardio: () => addCardio(),
  sw: el => swToggle(+el.dataset.si),
  cardioAct: el => { const ex = curEx(); if (ex.sets.some(x => x.done)) { toast('Add a new cardio for another activity'); return; } ex.activity = el.dataset.v; ex.name = PREFIX(ex.type) + el.dataset.v; LS.set('bt.' + ex.type + 'Last', el.dataset.v); saveSession(); renderTrain(); },
  cardioFeel: el => { const st = curEx().sets[+el.dataset.si]; st.feel = el.dataset.v; buzz(8); saveSession(); renderTrain(); },
  feel: el => { const s = S.session, ld = s && s.lastDone; if (!ld) return; const st = s.ex[ld.ei].sets[ld.si]; st.feel = st.feel === el.dataset.v ? '' : el.dataset.v; buzz(8); if (st.done) enqueue(setOp(ld.ei, ld.si)); saveSession(); renderTrain(); },
  exInfo: () => openExInfo(),
  swap: el => { const a = S.swapAlts[+el.dataset.i]; if (a) doSwap(a[0], a[2]); },
  swapCustom: () => { const v = $('#swapName').value.trim(); if (v) doSwap(v); else $('#swapName').focus(); },
  swapBack: () => { const ex = curEx(); if (ex.origName) doSwap(ex.origName); },
  food: () => openFood(),
  qa: el => { const p = presets()[+el.dataset.i]; if (p) { addFood(p); toast(`+ ${p.name} · ${p.protein} g protein`); render(); refreshFoodSheet(); } },
  foodDel: el => { delFood(el.dataset.id); render(); refreshFoodSheet(); },
  foodAdd: () => addCustomFood(),
  saveQa: el => { el.classList.toggle('on'); },
  presetDel: el => { const ps = presets(); ps.splice(+el.dataset.i, 1); LS.set('bt.presets', ps); refreshFoodSheet(); render(); },
  preview: el => { S.preview = S.preview === el.dataset.v ? null : el.dataset.v; if (S.tab !== 'train') { S.tab = 'train'; S.preview = el.dataset.v; } render(); },
  set: el => completeSet(S.session.cur, +el.dataset.si),
  work: el => startWork(S.session.cur, +el.dataset.si),
  workStop: () => { S.session.timer = null; stopAlarm(); saveSession(); renderTrain(); tick(); },
  workDone: () => { const { ei, si } = S.session.timer; S.session.timer = null; completeSet(ei, si); },
  restAdd: el => { const t = S.session.timer; if (!t) return; t.end = Math.max(Date.now() + 1000, (t.end < Date.now() ? Date.now() : t.end) + (+el.dataset.v) * 1000); t.total = Math.max(t.total, (t.end - Date.now()) / 1000); t.alerted = false; playAlarm([{ t: (t.end - Date.now()) / 1000, f: 880 }], sayTimer(t)); saveSession(); tick(); },
  restSkip: () => { S.session.timer = null; stopAlarm(); saveSession(); if (S.tab === 'train') renderTrain(); tick(); },
  go: el => { const i = +el.dataset.v; if (i < 0 || i >= S.session.ex.length) return; S.session.cur = i; saveSession(); closeSheet(); renderTrain(); window.scrollTo(0, 0); },
  addSet: () => { const ex = curEx(), l = ex.sets[ex.sets.length - 1]; ex.sets.push({ id: uid(), kg: l ? l.kg : '', reps: l ? l.reps : '', done: false }); saveSession(); renderTrain(); },
  rmSet: () => { const ex = curEx(); const l = ex.sets[ex.sets.length - 1]; if (l.done) enqueue({ op: 'delete', setId: l.id }); ex.sets.pop(); saveSession(); renderTrain(); },
  overview: () => openOverview(),
  settings: () => openSettings(),
  connect: () => connect(),
  editConn: () => { closeSheet(); renderSetup(); },
  syncNow: () => { S.sync = 'idle'; retryMs = 4000; closeSheet(); toast('Syncing…'); scheduleFlush(50); },
  testSound: () => { unlockAudio(); flash(); if (alarmMode() === 'lock') playAlarm([{ t: 0.6, f: 880 }], 'Sound test'); else beep(880, .18, 3); },
  alarmMode: () => {
    const next = alarmMode() === 'lock' ? 'music' : 'lock';
    LS.set('bt.alarmMode', next); setAudioSession();
    const t = S.session && S.session.timer;
    if (next === 'lock' && t && t.end > Date.now()) playAlarm([{ t: (t.end - Date.now()) / 1000, f: 880 }], sayTimer(t)); else stopAlarm();
    renderTrain(); tick();
    toast(next === 'lock' ? '🔒 Beeps with screen locked · pauses music' : '🎵 Music keeps playing · keep screen on');
  },
  finish: () => openFinish(),
  saveWorkout: () => finishWorkout(true),
  discard: el => { if (el.dataset.armed) return finishWorkout(false); el.dataset.armed = '1'; el.textContent = 'Tap again to discard — logged sets are removed'; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = 'Discard workout'; } }, 4000); },
  weighIn: el => openWeighIn(el.dataset.v),
  chip: el => { el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el && !el.classList.contains('on'))); },
  saveWeight: () => saveWeighIn(),
  closeSheet: () => closeSheet()
};
document.addEventListener('click', e => {
  if (S.session) unlockAudio();
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.id === 'scrim' && e.target !== el) return;
  ACT[el.dataset.act] && ACT[el.dataset.act](el, e);
});
document.addEventListener('input', e => {
  const el = e.target, f = el.dataset.f;
  if (!f || !S.session) return;
  const ex = curEx();
  if (f === 'note') { ex.userNote = el.value; saveSession(); return; }
  if (f === 'kg' || f === 'reps' || f === 'won' || f === 'lost') {
    const si = +el.dataset.si, st = ex.sets[si];
    st[f] = el.value.replace(',', '.');
    if (isTimeEx(ex.type) && f === 'reps') st.typed = true;
    document.querySelectorAll(`input[data-f="${f}"][data-si="${si}"]`).forEach(x => { if (x !== el) x.value = st[f]; });
    // typing kg into the first open set carries over to the following open sets
    if (f === 'kg' && !isTimeEx(ex.type)) ex.sets.forEach((x, i) => { if (i > si && !x.done) { x.kg = st.kg; const inp = document.querySelector(`input[data-f="kg"][data-si="${i}"]`); if (inp) inp.value = st.kg; } });
    saveSession();
  }
});
document.addEventListener('change', e => {
  const el = e.target, f = el.dataset.f;
  if (f === 'progEx') { S.progEx = el.value; renderProgress(); return; }
  if (S.session && (f === 'kg' || f === 'reps' || f === 'note')) {
    const ex = curEx();
    ex.sets.forEach((st, si) => { if (st.done) enqueue(setOp(S.session.cur, si)); });
  }
});
document.addEventListener('focusin', e => { if (e.target.matches('.set input, .stepper input')) setTimeout(() => e.target.select(), 0); });

/* ---------- boot ---------- */
function readSetupLink() {
  // Optional one-time link: .../?api=<exec url>&key=<key>
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('api') && q.get('key')) {
      LS.set('bt.api', { url: q.get('api').trim(), key: q.get('key').trim() });
      history.replaceState(null, '', location.pathname);
    }
  } catch (e) {}
}
function renderSetup(err, typed) {
  const c = typed || apiCfg() || {};
  $('#tabs').innerHTML = '';
  $('#app').innerHTML = `<div class="hdr"><div><h1>Connect your sheet</h1><div class="sub">One-time setup — stored only on this phone</div></div></div>
    <div class="card">
      <div class="field"><label for="cfgUrl">Apps Script web app URL</label><input id="cfgUrl" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(c.url || '')}"></div>
      <div class="field"><label for="cfgKey">App key</label><input id="cfgKey" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="From setupApi() in Apps Script" value="${esc(c.key || '')}"></div>
      ${err ? `<div class="coach neutral" style="color:var(--bad)"><span>⚠️</span><div>${esc(err)}</div></div>` : ''}
      <button class="btn pri mt" data-act="connect">Connect</button>
    </div>
    <div class="card"><h3>Where to find these</h3><div class="small muted">
      <b>URL:</b> Apps Script → Deploy → Manage deployments → copy the Web app URL (ends in <span class="num">/exec</span>).<br><br>
      <b>Key:</b> Apps Script → choose <b>setupApi</b> in the function list → ▶ Run → View → Logs.</div></div>`;
}
async function connect() {
  const cfg = { url: $('#cfgUrl').value.trim(), key: $('#cfgKey').value.trim() };
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(cfg.url)) return renderSetup('The URL should start with https://script.google.com/macros/s/ and end in /exec.', cfg);
  if (!cfg.key) return renderSetup('Enter the key from setupApi().', cfg);
  const b = $('[data-act=connect]'); b.textContent = 'Connecting…'; b.disabled = true;
  try {
    const d = await call('getBootstrap', null, cfg);
    LS.set('bt.api', cfg);
    applyData(d); cacheData(); S.sync = 'idle'; S.tab = S.session ? 'train' : 'today';
    render(); toast('Connected ✓'); flush();
  } catch (e) {
    renderSetup(e.code === 'bad_key' ? 'The key is wrong. Copy it again from the Apps Script log.' : (e.message || 'Could not connect.'), cfg);
  }
}
function openSettings() {
  const c = apiCfg() || {};
  const n = S.outbox.length + S.weightBox.length + S.foodBox.length + (S.planBox ? 1 : 0);
  showSheet(`<h2>Connection &amp; app</h2>
    <div class="li"><div style="flex:1"><div class="t">Google Sheet</div><div class="s">${S.sync === 'badkey' ? '⚠️ Key or URL rejected' : S.sync === 'offline' ? 'Offline — will retry' : 'Connected'} · ${n ? n + ' waiting to sync' : 'all synced'}</div></div></div>
    <div class="li"><div style="flex:1;min-width:0"><div class="t">Script URL</div><div class="s" style="overflow-wrap:anywhere">${esc(c.url || '–')}</div></div></div>
    <div class="li"><div style="flex:1"><div class="t">Rest alarm</div><div class="s">${alarmMode() === 'lock' ? '🔒 Lock mode — beeps with screen locked, pauses music' : '🎵 Music mode — beeps over music while the screen is on'}</div></div></div>
    ${PROG ? `<div class="li"><div style="flex:1"><div class="t">Program week</div><div class="s">Week 1 started ${fmtDate(progStart())}</div></div>
      <div class="row" style="gap:6px"><button class="icon-btn" data-act="setWeek" data-v="-1" aria-label="Earlier week">−</button><b class="num" style="min-width:34px;text-align:center">W${progWeekOf(today())}</b><button class="icon-btn" data-act="setWeek" data-v="1" aria-label="Later week">+</button></div></div>` : ''}
    <button class="btn mt" data-act="syncNow">Sync now</button>
    <button class="btn mt" data-act="testSound">🔊 Test sound</button>
    <button class="btn ghost mt" data-act="editConn">Change URL or key</button>
    <div class="tiny dim mt2" style="text-align:center">${esc(CFG.name)} · v${APP_VERSION}</div>`);
}
async function boot() {
  readSetupLink();
  /* sw:start */
  if ('serviceWorker' in navigator) {
    try {
      const had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then(r => {
        const kick = w => { if (w) w.postMessage('skip'); };
        kick(r.waiting);
        r.addEventListener('updatefound', () => { const w = r.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') kick(w); }); });
        try { r.update(); } catch (e) {}
      }).catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!had || window.__reloading) return;
        if (S.session) { S.updateReady = true; toast('Update ready — loads after this workout'); }
        else { window.__reloading = true; location.reload(); }
      });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });
    } catch (e) {}
  }
  /* sw:end */
  S.session = LS.get('bt.session', null);
  S.outbox = LS.get('bt.outbox', []);
  S.weightBox = LS.get('bt.weightBox', []);
  S.foodBox = LS.get('bt.foodBox', []);
  S.planBox = LS.get('bt.planBox', null);
  const cache = LS.get('bt.cache', null);
  if (cache) { applyData(cache); if (!cache.food) S.food = applyFoodOps([], S.foodBox); }
  if (S.session) { S.tab = 'train'; keepAwake(true); }
  if (!hasGAS()) return renderSetup();
  render();
  try {
    const d = await call('getBootstrap');
    applyData(d); cacheData(); render(); flush();
  } catch (e) {
    if (e.code === 'bad_key' || e.code === 'bad_url') { S.sync = 'badkey'; if (!cache) return renderSetup(e.code === 'bad_key' ? 'The key is wrong. Copy it again from the Apps Script log.' : e.message); renderSync(); return; }
    S.sync = 'offline';
    if (!cache) $('#app').innerHTML = `<div class="loading"><div style="text-align:center"><div class="e" style="font-size:32px">📡</div>Couldn't reach your Google Sheet. Check your signal.<br><span class="small dim">${esc(e.message || e)}</span><br><br><button class="btn sm pri" onclick="location.reload()">Retry</button></div></div>`;
    else renderSync();
    scheduleFlush(retryMs);
  }
}
boot();
</script>
